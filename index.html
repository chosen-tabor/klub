<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Chosen Club Tábor</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12636f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="The Chosen Club">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <!-- PŘEPÍNAČ MOTIVU (VŽDY DOSTUPNÝ V ROCHU) -->
  <div class="top-actions">
    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Přepnout motiv">
      <span id="themeIcon">🌙</span> <span id="themeLabel">Tmavý režim</span>
    </button>
  </div>

  <!-- PŘIHLAŠOVACÍ OBRAZOVKA (PRO NEPŘIHLÁŠENÉ) -->
  <section id="loginScreen" class="login-view">
    <header>
      <div class="subtitle">Seriál Vyvolení</div>
      <h1>THE CHOSEN</h1>
      <div class="location-info">Církev bratrská Tábor, Bechyňská 1636/2</div>
    </header>

    <div class="login-card">
      <h2>Vstup pro organizátory</h2>
      <p class="login-desc">Přihlaste se prosím svým jménem a týmovým PINem.</p>

      <form id="loginForm">
        <div class="input-box">
          <label for="loginName">Tvoje jméno</label>
          <input type="text" id="loginName" placeholder="Např. Michal" required autocomplete="name">
        </div>

        <div class="input-box">
          <label for="loginPin">Týmový PIN</label>
          <input type="password" id="loginPin" maxlength="8" placeholder="••••" required autocomplete="current-password">
        </div>

        <div id="loginError" class="login-error hidden"></div>

        <button type="submit" id="loginBtn" class="btn-submit">Vstoupit do aplikace</button>
      </form>
    </div>
  </section>

  <!-- HLAVNÍ APLIKACE (PO PŘIHLÁŠENÍ) -->
  <section id="appScreen" class="app-view hidden">
    <header>
      <div class="subtitle">Seriál Vyvolení</div>
      <h1>THE CHOSEN</h1>
      <div class="location-info">
        Církev bratrská Tábor, Bechyňská 1636/2<br>
        Středy od 18:00 (promítání & diskuze)
      </div>
    </header>

    <!-- LIŠTA PŘIHLÁŠENÉHO UŽIVATELE -->
    <div class="user-bar">
      <span>Přihlášen: <strong id="loggedUserLabel" class="user-name-display"></strong></span>
      <button id="logoutBtn" class="btn-logout">Odhlásit</button>
    </div>

    <!-- SYNCHRONIZACE -->
    <div class="sync-panel">
      <span id="statusText">Načítám data...</span>
      <button class="btn-refresh" id="refreshBtn">↻ Obnovit</button>
    </div>

    <!-- SEZNAM KARET VEČERŮ -->
    <main class="sessions-list" id="sessionsList"></main>
  </section>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
