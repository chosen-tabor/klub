<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Chosen Club Tábor</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d7c8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Chosen Club">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <header>
    <div class="subtitle">Seriál Vyvolení</div>
    <h1>The CHOSEN</h1>
    <div class="location-info">
      Církev bratrská Tábor, Bechyňská 1636/2<br>
      Středy od 18:00 (promítání & interaktivní diskuze)
    </div>
  </header>

  <div class="identity-card">
    <div class="input-box">
      <label for="userName">Moje Jméno</label>
      <input type="text" id="userName" placeholder="Např. Michal">
    </div>
    <div class="input-box" style="max-width: 120px;">
      <label for="userPin">Týmový PIN</label>
      <input type="password" id="userPin" maxlength="8" placeholder="****">
    </div>
  </div>

  <div class="sync-panel">
    <span id="statusText">Načítám data...</span>
    <button class="btn-refresh" id="refreshBtn">↻ Obnovit</button>
  </div>

  <main class="sessions-list" id="sessionsList"></main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
