<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Chosen Club CB Tábor</title>
  
  <link rel="manifest" href="manifest.json">

  <!-- iPhone / iPad ikona a zobrazení -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Chosen Club">

  <!-- Ikona v prohlížeči (favicon) -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">  
  <meta name="theme-color" content="#090d16">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

  <!-- ==========================================
       PŘIHLAŠOVACÍ OBRAZOVKA (PRO NEPŘIHLÁŠENÉ)
       ========================================== -->
  <section id="loginScreen" class="login-screen-wrap">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 0.5rem;">
        <img src="./apple-touch-icon.png" alt="Logo" class="brand-icon" style="margin: 0 auto 0.75rem auto; width: 56px; height: 56px; min-width: 56px;">
        <div class="brand-sub">CB Tábor</div>
        <h1 class="brand-title" style="font-size: 1.7rem; margin-top: 0.2rem;">The CHOSEN</h1>
      </div>

      <p style="text-align: center; color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem;">
        Vstup pro organizační tým
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginName" class="form-label">Tvoje jméno</label>
          <input type="text" id="loginName" class="form-input" placeholder="Např. Michal" required autocomplete="name">
        </div>

        <div class="form-group" style="margin-top: 0.75rem;">
          <label for="loginPin" class="form-label">Týmový nebo Admin PIN</label>
          <input type="password" id="loginPin" class="form-input" maxlength="8" placeholder="••••" required autocomplete="current-password">
        </div>

        <div id="loginError" class="login-error-msg hidden" style="margin-top: 0.75rem;"></div>

        <button type="submit" id="loginBtn" class="btn-login-submit">Vstoupit do aplikace</button>
      </form>
    </div>
  </section>

  <!-- ==========================================
       HLAVNÍ OBRAZOVKA APLIKACE (PO PŘIHLÁŠENÍ)
       ========================================== -->
  <section id="appScreen" class="hidden">
    <!-- HLAVIČKA APLIKACE -->
    <header class="app-header">
      <div class="brand-wrap">
        <img src="./apple-touch-icon.png" alt="Logo" class="brand-icon" width="38" height="38">
        <div class="brand-text-block">
          <span class="brand-sub">CB Tábor</span>
          <h1 class="brand-title">The CHOSEN</h1>
        </div>
      </div>

      <div class="header-controls">
        <button id="themeToggleBtn" type="button" class="btn-theme-toggle" title="Přepnout motiv">
          <span id="themeIcon">🌙</span>
          <span id="themeLabel" class="theme-label-text">Tmavý</span>
        </button>
        
        <div class="user-pill">
          <span id="loggedUserLabel" class="user-name">...</span>
          <button id="logoutBtn" type="button" class="btn-logout" title="Odhlásit">✕</button>
        </div>
      </div>
    </header>

    <!-- STAVOVÁ A SYNCHRONIZAČNÍ LIŠTA -->
    <div class="status-bar">
      <span id="statusText">Načítám data...</span>
      <button class="btn-refresh" id="refreshBtn">↻ Obnovit</button>
    </div>

    <!-- SEZNAM KARET S DÍLY -->
    <main id="sessionsList"></main>
  </section>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
